<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <meta keywords>
    
 
    
    <title>registration page</title>
</head>
<body>

 <form action="about.html" autocomplete="off" >
    <fieldset>
        <legend>personal information</legend>
    <label for="firstname">First Name: </label>
    <input type="text" id="firstname" placeholder="First Name">
    <br>
    <br>
    <label for="lasrtname">First Name: </label>
    <input type="text" id="lasttname" placeholder="Last Name">
    <br>
    <br>
    <label for="Email">Email: </label>
    <input autofocus type="email" id="Email" placeholder=" Enter Your Email">
    <br>
    <br>
    <label for="area"> Area: </label>
    <input type="text" id="area" value="Cairo" readonly >
    <br>
    <br>
    <label for="password">Password: </label>
    <input placeholder="Enter Your Password" type="password" id="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
      title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters">
    <br>
    <br>
    <label for="phone">Phone number: </label>
    <input placeholder="Enter Phone Number" id="phone" type="text" name="phone" pattern="01(0|1|2|5)[0-9]{8}" maxlength="11">
    <br>
    <br>
    <label for="gender">Gender:</label>
    <input checked id="female" type="radio" value="female" name="gender">
    <label for="female">Female</label>
    <input  id="male" type="radio" value="male" name="gender">
    <label for="male">Male</label>
    <br>
    <br>
    <label for="courses" >Cources:</label>
    <input  checked type="checkbox" id="frontend">
    <label for="frontend">frontend</label>
    <input type="checkbox" id="backend">
    <label for="backend">backend</label>
    <input type="checkbox" id="network">
    <label for="network">network</label>
    <br>
    <br>
    <label for="age">Age: </label>
    <input step="1" id="age" type="number" min="6" max="18">
    <br>
    <br>
    <select name="track" id="track">
        <option value="please select your track" disabled selected>please select your track</option>
        <option value="ML">ML</option>
        <option value="mobile app">mobile app</option>
        <br>

    </select>

    <input type="file" accept="image/png">
    <br>
    <br>
    <label for="homepage">Homepage:</label>
    <input placeholder="Enter The Homepage" type ="url" pattern="https?://.+" title="Include http://" >
    <br>
    <br>
    <input type="datetime-local" placeholder="Enter The Date">
    <br>
    <br>
    <input type="color">
    <br>
    <br>
    <input type="range" min="1" max="18" value="6" placeholder="Enter Your Age">
    <br>
    <br>
    <label for="id" >id :</label>
    <input placeholder="Enter Your ID" type="text"  minlength="14" maxlength="14">
    <br>
    <br>
    <textarea name="comment" id="comment" placeholder="Enter Your Comment" cols="50" rows="5"></textarea>
    <br>
    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

    </fieldset>




 </form>

</body>

</html>
